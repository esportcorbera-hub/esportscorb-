{% load static %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportsCorb - Calendari Públic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg: #fdfdfd;
            --border: #eeeeee;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--primary); margin: 0; }

        /* Top Bar */
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 40px; background: var(--primary); color: white;
        }
        #top-bar h1 { margin: 0; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        #top-bar h1 span { color: var(--accent); }
        .btn-staff { border: 1px solid var(--accent); color: var(--accent); padding: 6px 15px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; }

        /* Estructura Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 55px);
        }

        /* Sidebar */
        .sidebar {
            background: white; border-right: 1px solid var(--border);
            padding: 40px 30px; display: flex; flex-direction: column; gap: 30px;
        }

        .sidebar h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .sidebar p { font-size: 0.9rem; color: #777; line-height: 1.4; }

        .filter-box { width: 100%; }
        .facility-filter { border: 0; padding: 0; margin: 0; }
        .facility-filter legend { float: none; width: auto; margin-bottom: 12px; font-size: .9rem; font-weight: 700; }
        .facility-list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 250px); overflow-y: auto; padding-right: 4px; }
        .facility-option { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: .88rem; }
        .facility-option:hover { background: #f8f8f8; }
        .facility-option input { order: 3; width: 12px; height: 12px; margin: 0 0 0 auto; accent-color: var(--primary); flex: 0 0 auto; }
        .facility-option span { line-height: 1.25; }
        .facility-option.all-option { font-weight: 700; border-color: #d8d8d8; }
        .facility-dot { order: 1; width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
        .facility-option span:not(.facility-dot) { order: 2; }

        /* Contenidor de la Imatge (Protegit contra ValueError) */
        /* Fotos i referències preservades per recol·locar-les més endavant; ara no ocupen espai lateral. */
        #photo-container {
            margin-top: auto; width: 100%; height: 200px;
            border-radius: 12px; overflow: hidden; background: #222;
            display: none !important; border: 1px solid var(--border); position: relative;
        }

        #photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        #no-photo-placeholder {
            height: 100%; display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #555;
        }

        .photo-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white; padding: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }

        /* Àrea del Calendari */
        .calendar-area { padding: 30px; background: #fff; }
        #calendar { height: auto; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
            #photo-container { display: none !important; } 
        }
    </style>
</head>
<body>

    <nav id="top-bar">
        <h1>Esports<span>Corb</span></h1>
        <a href="{% url 'login' %}" class="btn-staff">ACCÉS ENTITATS</a>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div>
                <h2>Instal·lacions</h2>
                <p>Consulta les activitats i entrenaments de les nostres instal·lacions.</p>
            </div>

            <div class="filter-box">
                <fieldset class="facility-filter" id="selector-instalacio">
                    <legend>Tria les instal·lacions que vols veure</legend>
                    <div class="facility-list">
                        <label class="facility-option all-option">
                            <input id="select-all-facilities" type="checkbox" checked>
                            <span>Totes les instal·lacions</span>
                        </label>
                    {% for inst in instalacions %}
                        <label class="facility-option"><input class="facility-checkbox" type="checkbox" value="{{ inst.id }}" checked 
                                data-img="{% if inst.nom == 'Camp futbol' or inst.nom == 'Camp de Futbol' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0249_vbmwmi{% elif inst.nom == 'Pista Cau de la guineu' or inst.nom == 'Cau de la Guineu' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0241_bqtxum{% elif inst.nom == 'Gimnàs Balmes' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0245_d1gmru{% elif inst.nom == 'Pavelló' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0252_huhcow{% elif inst.nom == 'Pista atletisme' or inst.nom == 'Pista Atletisme' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0250_xo2t7o{% elif inst.nom == 'Pista bàsquet Balmes' or inst.nom == 'Pista Bàsquet Balmes' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0244_o2lu5z{% elif inst.nom == 'Pista futsal  Balmes' or inst.nom == 'Pista futsal Balmes' or inst.nom == 'Pista Futsal Balmes' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0243_a5vpom{% elif inst.nom == 'Pista blanca' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0246_dosnfc{% elif inst.nom == 'Pista verda' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0247_oiqrwl{% elif inst.nom == "Pista Puig d'agulles" or inst.nom == "Puig d'Agulles" %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0240_z1caot{% elif inst.nom == 'Rocòdrom' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0253_cqp0mo{% elif inst.nom == 'Sala cycling' or inst.nom == 'Sala Cycling' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0248_if8jsh{% elif inst.nom == 'Sala sota grades' or inst.nom == 'Sala Grades' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0254_kf7lb5{% elif inst.nom == 'Sala pavelló' or inst.nom == 'Sala Pavelló' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0251_etqqvk{% elif inst.nom == 'Trial bike' or inst.nom == 'Trial Bike' %}https://res.cloudinary.com/ds35ja96l/image/upload/f_auto,q_auto,w_900/v1/instalacions/DSC_0242_qenuxj{% else %}none{% endif %}"><span class="facility-dot" style="background-color: {{ inst.color|default:'#6c757d' }}"></span><span>{{ inst.nom }}</span></label>
                    {% endfor %}
                    </div>
                </fieldset>
            </div>

            <div id="photo-container">
                <img id="inst-photo" src="" alt="" style="display: none;">
                <div id="no-photo-placeholder">
                    <i class="bi bi-building fs-1"></i>
                    <span class="mt-2 small fw-bold">SENSE FOTO</span>
                </div>
                <div class="photo-label" id="photo-name"></div>
            </div>
        </aside>

        <main class="calendar-area">
            <div id='calendar'></div>
        </main>
    </div>

    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'ca',
                firstDay: 1,
                height: 'auto',
                allDaySlot: false,
                slotMinTime: '08:00:00',
                slotMaxTime: '24:00:00',
                scrollTime: '08:00:00',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,timeGridWeek,timeGridDay' 
                },
                buttonText: { today: 'Avui', month: 'Mes', week: 'Setmana', day: 'Dia' },
                events: '/api/reserves/',

                eventDidMount: function(info) {
                    aplicarFiltreInstalacions();
                },

                eventClick: function(info) {
                    Swal.fire({
                        title: info.event.extendedProps.instalacio,
                        text: info.event.title,
                        confirmButtonColor: '#1a1a1a'
                    });
                }
            });
            calendar.render();
        });

        document.addEventListener('DOMContentLoaded', function() {
            const totes = document.getElementById('select-all-facilities');
            const caselles = Array.from(document.querySelectorAll('.facility-checkbox'));

            totes.addEventListener('change', function() {
                caselles.forEach(casella => { casella.checked = totes.checked; });
                actualitzarTot();
            });

            caselles.forEach(casella => casella.addEventListener('change', function() {
                totes.checked = caselles.every(item => item.checked);
                actualitzarTot();
            }));
        });

        function aplicarFiltreInstalacions() {
            if (!calendar) return;
            const seleccionades = new Set(
                Array.from(document.querySelectorAll('.facility-checkbox:checked')).map(casella => casella.value)
            );

            calendar.getEvents().forEach(ev => {
                const idInst = String(ev.extendedProps.id_inst || '');
                const idPare = String(ev.extendedProps.id_pare || '');
                const tipus = ev.extendedProps.tipus;
                const esExcepcio = tipus === 'extra' || tipus === 'conserge' || ev.allDay;
                const esSeleccionada = seleccionades.has(idInst) || seleccionades.has(idPare);
                ev.setProp('display', esExcepcio || esSeleccionada ? 'auto' : 'none');
            });
        }

        function actualitzarTot() {
            const seleccionades = Array.from(document.querySelectorAll('.facility-checkbox:checked'));
            const container = document.getElementById('photo-container');
            const img = document.getElementById('inst-photo');
            const placeholder = document.getElementById('no-photo-placeholder');
            const label = document.getElementById('photo-name');

            // La foto es mostra quan s'ha triat una sola instal·lació.
            if (seleccionades.length !== 1) {
                container.style.display = 'none';
            } else {
                const casella = seleccionades[0];
                const nom = casella.closest('.facility-option').querySelector('span:last-of-type').textContent.trim();
                const dataImg = casella.dataset.img;
                container.style.display = 'block';
                label.textContent = nom;
                if (dataImg === 'none' || !dataImg) {
                    img.style.display = 'none';
                    placeholder.style.display = 'flex';
                } else {
                    img.src = dataImg;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }
            }

            aplicarFiltreInstalacions();
        }

    </script>
</body>
</html>
