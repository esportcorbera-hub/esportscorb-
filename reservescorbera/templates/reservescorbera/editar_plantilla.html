<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Entrenament - Esports Corb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .edit-container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>

<style id="responsive-layout">
/* Adaptació de la mateixa interfície a mòbil, tauleta i ordinador. */
*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; }
img, video, iframe { max-width: 100%; }
input, select, textarea, button { max-width: 100%; }
.table-responsive { max-width: 100%; }
@media (max-width: 991.98px) {
  .main-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { min-width: 0; }
  .calendar-area { min-width: 0; }
  .navbar .container, .navbar .container-fluid { flex-wrap: wrap; gap: 10px; }
  .custom-select { max-width: 100%; }
}
@media (max-width: 767.98px) {
  body { overflow-x: hidden; }
  #top-bar, .navbar-custom { padding-left: 14px !important; padding-right: 14px !important; }
  #top-bar { gap: 10px; flex-wrap: wrap; }
  #top-bar h1 { font-size: 1rem; }
  .user-nav { gap: 8px; flex-wrap: wrap; }
  .action-bar { padding: 12px 14px; gap: 8px; }
  .action-bar > * { max-width: 100%; }
  .custom-select { width: 100% !important; }
  .calendar-area { padding: 14px !important; }
  #calendar { min-width: 0; max-width: 100%; overflow-x: auto; }
  #calendar .fc { min-width: 620px; }
  .login-card { width: min(340px, calc(100% - 28px)); padding: 28px 22px; }
  .container-fluid, .container { max-width: 100%; }
  .container-fluid.px-5 { padding-left: 14px !important; padding-right: 14px !important; }
  .header-section { padding: 72px 14px 28px !important; }
  .btn-tornar { left: 12px !important; top: 12px !important; }
  .calendar-container { overflow-x: auto !important; }
  .calendar-header-row, .calendar-body-row { min-width: 700px; }
  .empty-state { padding: 28px 18px; }
  .modal-dialog { margin: 12px; }
}
@media (min-width: 768px) and (max-width: 1199.98px) {
  .container-fluid.px-5 { padding-left: 24px !important; padding-right: 24px !important; }
  .calendar-area { padding: 22px; }
}
</style>

</head>
<body>

<div class="container">
    <div class="edit-container shadow">
        <h3 class="fw-bold mb-4 text-dark"><i class="bi bi-pencil-square me-2"></i>Editar Entrenament</h3>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold">Dia de la setmana</label>
                <select name="dia_setmana" class="form-select" required>
                    {% for id, nom in dies_setmana %}
                    <option value="{{ id }}" {% if item.dia_setmana == id %}selected{% endif %}>{{ nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Instal·lació</label>
                <select name="instalacio" id="selectInstalacio" class="form-select" required onchange="filtrarHores()">
                    {% for inst in instalacions %}
                    <option value="{{ inst.id }}" {% if item.instalacio.id == inst.id %}selected{% endif %}>{{ inst.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Usuari Responsable</label>
                <select name="usuari" class="form-select" required>
                    {% for u in usuaris %}
                    <option value="{{ u.id }}" {% if item.user.id == u.id %}selected{% endif %}>{{ u.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Hora Inici</label>
                    <select name="inici" id="selectInici" class="form-select" required>
                        {% for h in franges %}
                        <option value="{{ h }}" {% if item.inici|time:"H:i" == h %}selected{% endif %}>{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Hora Final</label>
                    <select name="final" id="selectFinal" class="form-select" required>
                        {% for h in franges %}
                        <option value="{{ h }}" {% if item.final|time:"H:i" == h %}selected{% endif %}>{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Equip / Activitat</label>
                <input type="text" name="activitat" class="form-control" value="{{ item.activitat }}" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold">GUARDAR CANVIS</button>
                <a href="{% url 'gestio_plantilla' %}" class="btn btn-secondary w-100 fw-bold">CANCEL·LAR</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Aprofitem la mateixa lògica per bloquejar hores segons la pista
    const horarisPistes = {
        {% for inst in instalacions %}
        "{{ inst.id }}": { "obertura": "{{ inst.hora_obertura|time:'H:i' }}", "tancament": "{{ inst.hora_tancament|time:'H:i' }}" },
        {% endfor %}
    };

    function filtrarHores() {
        const instId = document.getElementById('selectInstalacio').value;
        const obertura = horarisPistes[instId].obertura;
        const tancament = horarisPistes[instId].tancament;

        [document.getElementById('selectInici'), document.getElementById('selectFinal')].forEach(select => {
            for (let option of select.options) {
                const h = option.value;
                if (h < obertura || h > tancament) {
                    option.hidden = true;
                    option.disabled = true;
                } else {
                    option.hidden = false;
                    option.disabled = false;
                }
            }
        });
    }

    // Executem un cop al carregar per si la pista actual té restriccions
    window.onload = filtrarHores;
</script>

</body>
</html>
