{% load static %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EsportsCorb</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #d4af37;
            --text-light: #ffffff;
        }

        /* Configuració del fons amb la teva imatge */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Color de seguretat */
            
            /* Imatge de fons */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                              url("{% static 'img/login.jpg' %}");
            
            /* Ajust del "zoom" i posició */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Targeta de Login */
        .login-card {
            background: rgba(26, 26, 26, 0.92); /* Una mica transparent per veure el fons */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 340px;
            text-align: center;
            color: var(--text-light);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(5px); /* Efecte de vidre esmerilat */
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: block;
        }

        /* Formulari */
        .error-msg {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: rgba(43, 43, 43, 0.8);
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #333;
        }

        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-entrar:hover {
            background: #b8962d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* Botó de tornar */
        .btn-tornar {
            display: inline-block;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-tornar:hover {
            color: var(--accent-color);
        }
    </style>

<style id="responsive-layout">
/* Adaptació de la mateixa interfície a mòbil, tauleta i ordinador. */
*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; }
img, video, iframe { max-width: 100%; }
input, select, textarea, button { max-width: 100%; }
.table-responsive { max-width: 100%; }
@media (max-width: 991.98px) {
  .main-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { min-width: 0; }
  .calendar-area { min-width: 0; }
  .navbar .container, .navbar .container-fluid { flex-wrap: wrap; gap: 10px; }
  .custom-select { max-width: 100%; }
}
@media (max-width: 767.98px) {
  body { overflow-x: hidden; }
  #top-bar, .navbar-custom { padding-left: 14px !important; padding-right: 14px !important; }
  #top-bar { gap: 10px; flex-wrap: wrap; }
  #top-bar h1 { font-size: 1rem; }
  .user-nav { gap: 8px; flex-wrap: wrap; }
  .action-bar { padding: 12px 14px; gap: 8px; }
  .action-bar > * { max-width: 100%; }
  .custom-select { width: 100% !important; }
  .calendar-area { padding: 14px !important; }
  #calendar { min-width: 0; max-width: 100%; overflow-x: auto; }
  #calendar .fc { min-width: 620px; }
  .login-card { width: min(340px, calc(100% - 28px)); padding: 28px 22px; }
  .container-fluid, .container { max-width: 100%; }
  .container-fluid.px-5 { padding-left: 14px !important; padding-right: 14px !important; }
  .header-section { padding: 72px 14px 28px !important; }
  .btn-tornar { left: 12px !important; top: 12px !important; }
  .calendar-container { overflow-x: auto !important; }
  .calendar-header-row, .calendar-body-row { min-width: 700px; }
  .empty-state { padding: 28px 18px; }
  .modal-dialog { margin: 12px; }
}
@media (min-width: 768px) and (max-width: 1199.98px) {
  .container-fluid.px-5 { padding-left: 24px !important; padding-right: 24px !important; }
  .calendar-area { padding: 22px; }
}
</style>

</head>
<body>

    <div class="login-card">
        <h1>EsportsCorb</h1>
        <span class="subtitle">Gestió de Reserves de les insal·lacions esportives</span>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Correu electrònic" required>
            <input type="password" name="password" placeholder="Contrasenya" required>
            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>

        <a href="/" class="btn-tornar">← Tornar al calendari</a>
    </div>

</body>
</html>
