<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Instal·lació - EsportsCorb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-save { background: #1a1a1a; color: #d4af37; border: 2px solid #d4af37; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #d4af37; color: #1a1a1a; transform: translateY(-2px); }
        .form-label { font-weight: bold; color: #333; }
        .header-title { border-left: 5px solid #d4af37; padding-left: 15px; }
        
        /* Seccions especials */
        .config-section {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .subzone-box { 
            display: none; 
            background: #fffdf5; 
            border-left: 4px solid #d4af37; 
            padding: 20px; 
            border-radius: 8px;
            margin-top: 15px;
        }
        .finde-box {
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25); }
        .form-check-input:checked { background-color: #d4af37; border-color: #d4af37; }
    </style>

<style id="responsive-layout">
/* Adaptació de la mateixa interfície a mòbil, tauleta i ordinador. */
*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; }
img, video, iframe { max-width: 100%; }
input, select, textarea, button { max-width: 100%; }
.table-responsive { max-width: 100%; }
@media (max-width: 991.98px) {
  .main-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { min-width: 0; }
  .calendar-area { min-width: 0; }
  .navbar .container, .navbar .container-fluid { flex-wrap: wrap; gap: 10px; }
  .custom-select { max-width: 100%; }
}
@media (max-width: 767.98px) {
  body { overflow-x: hidden; }
  #top-bar, .navbar-custom { padding-left: 14px !important; padding-right: 14px !important; }
  #top-bar { gap: 10px; flex-wrap: wrap; }
  #top-bar h1 { font-size: 1rem; }
  .user-nav { gap: 8px; flex-wrap: wrap; }
  .action-bar { padding: 12px 14px; gap: 8px; }
  .action-bar > * { max-width: 100%; }
  .custom-select { width: 100% !important; }
  .calendar-area { padding: 14px !important; }
  #calendar { min-width: 0; max-width: 100%; overflow-x: auto; }
  #calendar .fc { min-width: 620px; }
  .login-card { width: min(340px, calc(100% - 28px)); padding: 28px 22px; }
  .container-fluid, .container { max-width: 100%; }
  .container-fluid.px-5 { padding-left: 14px !important; padding-right: 14px !important; }
  .header-section { padding: 72px 14px 28px !important; }
  .btn-tornar { left: 12px !important; top: 12px !important; }
  .calendar-container { overflow-x: auto !important; }
  .calendar-header-row, .calendar-body-row { min-width: 700px; }
  .empty-state { padding: 28px 18px; }
  .modal-dialog { margin: 12px; }
}
@media (min-width: 768px) and (max-width: 1199.98px) {
  .container-fluid.px-5 { padding-left: 24px !important; padding-right: 24px !important; }
  .calendar-area { padding: 22px; }
}
</style>

</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                <div class="card p-4">
                    <h2 class="mb-4 header-title">Configurar Instal·lació</h2>
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label">Nom de la Instal·lació Principal</label>
                            <input type="text" name="nom" class="form-control form-control-lg" placeholder="Ex: Pavelló Municipal" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Imatge</label>
                                <input type="file" name="imatge" class="form-control" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Color al Calendari</label>
                                <input type="color" name="color" class="form-control form-control-color w-100" value="#d4af37">
                            </div>
                        </div>

                        <hr>

                        <h5 class="mb-3"><i class="bi bi-clock"></i> Horari Dilluns a Divendres</h5>
                        <div class="config-section row">
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Obertura</label>
                                <input type="time" name="hora_obertura" class="form-control" value="08:00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Tancament</label>
                                <input type="time" name="hora_tancament" class="form-control" value="23:00" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0"><i class="bi bi-calendar-week"></i> Horari Cap de Setmana</h5>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="obertFinde" name="obert_cap_setmana" checked onchange="toggleHorariFinde()">
                                <label class="form-check-label fw-bold" for="obertFinde">Obert el cap de setmana</label>
                            </div>
                        </div>

                        <div id="seccioFinde" style="display: block;">
                            
                            <div class="config-section mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6 class="mb-0 fw-bold text-secondary"><i class="bi bi-calendar-day"></i> Dissabte</h6>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="obertDissabte" name="obert_dissabte" checked onchange="toggleDia('Dissabte')">
                                    </div>
                                </div>
                                <div class="row" id="inputsDissabte">
                                    <div class="col-md-6">
                                        <label class="small fw-bold">Obertura Dissabte</label>
                                        <input type="time" name="hora_obertura_dissabte" class="form-control" value="09:00">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="small fw-bold">Tancament Dissabte</label>
                                        <input type="time" name="hora_tancament_dissabte" class="form-control" value="21:00">
                                    </div>
                                </div>
                                <div id="msgDissabteTancat" class="text-muted small mt-2" style="display: none;"><em>Tancat els dissabtes.</em></div>
                            </div>

                            <div class="config-section mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6 class="mb-0 fw-bold text-secondary"><i class="bi bi-calendar-day"></i> Diumenge</h6>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="obertDiumenge" name="obert_diumenge" checked onchange="toggleDia('Diumenge')">
                                    </div>
                                </div>
                                <div class="row" id="inputsDiumenge">
                                    <div class="col-md-6">
                                        <label class="small fw-bold">Obertura Diumenge</label>
                                        <input type="time" name="hora_obertura_diumenge" class="form-control" value="09:00">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="small fw-bold">Tancament Diumenge</label>
                                        <input type="time" name="hora_tancament_diumenge" class="form-control" value="14:00">
                                    </div>
                                </div>
                                <div id="msgDiumengeTancat" class="text-muted small mt-2" style="display: none;"><em>Tancat els diumenges.</em></div>
                            </div>

                        </div>

                        <div id="missatgeTancat" class="alert alert-warning mb-4" style="display: none;">
                            <i class="bi bi-info-circle-fill"></i> La instal·lació romandrà <strong>tancada</strong> completament el cap de setmana.
                        </div>

                        <hr>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="teZones" name="te_zones" onchange="toggleZones()">
                            <label class="form-check-label fw-bold" for="teZones">Té sub-espais o zones divisibles?</label>
                        </div>

                        <div id="seccioZones" class="subzone-box">
                            <label class="form-label text-dark">Noms de les zones (separats per comes)</label>
                            <textarea name="noms_subzones" class="form-control" rows="2" placeholder="Ex: Pista 1, Pista 2, Pista 3"></textarea>
                            <div class="form-text mt-2">
                                <i class="bi bi-magic"></i> Es crearan automàticament compartint el mateix horari i foto.
                            </div>
                        </div>

                        <div class="mt-5 d-flex justify-content-between align-items-center">
                            <a href="{% url 'gestio_tecnica' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel·lar
                            </a>
                            <button type="submit" class="btn btn-save px-5 shadow">
                                <i class="bi bi-check-circle"></i> GUARDAR INSTAL·LACIÓ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Funció per mostrar/amagar horari de cap de setmana
        function toggleHorariFinde() {
            const obert = document.getElementById('obertFinde').checked;
            const seccio = document.getElementById('seccioFinde');
            const missatge = document.getElementById('missatgeTancat');
            
            if (obert) {
                seccio.style.display = 'block';
                missatge.style.display = 'none';
                toggleDia('Dissabte');
                toggleDia('Diumenge');
            } else {
                seccio.style.display = 'none';
                missatge.style.display = 'block';
                // Desactivem tots els inputs de la secció si està tancat general
                seccio.querySelectorAll('input[type="time"]').forEach(i => i.disabled = true);
            }
        }

        function toggleDia(dia) {
            // Si el cap de setmana general està apagat, no fem res
            if (!document.getElementById('obertFinde').checked) return;

            const obertDia = document.getElementById(`obert${dia}`).checked;
            const rowInputs = document.getElementById(`inputs${dia}`);
            const msgTancat = document.getElementById(`msg${dia}Tancat`);
            const inputs = rowInputs.querySelectorAll('input');

            if (obertDia) {
                rowInputs.style.display = 'flex';
                msgTancat.style.display = 'none';
                inputs.forEach(i => i.disabled = false);
            } else {
                rowInputs.style.display = 'none';
                msgTancat.style.display = 'block';
                inputs.forEach(i => i.disabled = true);
            }
        }

        // Funció per mostrar/amagar secció de subzones
        function toggleZones() {
            const seccio = document.getElementById('seccioZones');
            const checkbox = document.getElementById('teZones');
            
            if (checkbox.checked) {
                seccio.style.display = 'block';
                seccio.scrollIntoView({ behavior: 'smooth' });
            } else {
                seccio.style.display = 'none';
            }
        }

        // Execució inicial en cas d'error de validació o edició
        document.addEventListener('DOMContentLoaded', function() {
            toggleHorariFinde();
            // Si estem editant i hi ha text a les zones, obrim la secció
            if (document.querySelector('textarea[name="noms_subzones"]').value.trim() !== "") {
                document.getElementById('teZones').checked = true;
                toggleZones();
            }
        });
    </script>
</body>
</html>
