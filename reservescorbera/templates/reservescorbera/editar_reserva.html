<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva - Esports Corbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #d4af37;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .edit-card {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-label {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .form-control, .form-select {
            background-color: #000;
            border: 1px solid #333;
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background-color: #050505;
            border-color: var(--accent);
            color: white;
            box-shadow: none;
        }

        .btn-save {
            background-color: var(--accent);
            color: black;
            font-weight: 800;
            border: none;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
        }

        .btn-save:hover { background-color: #b8962d; }

        .btn-cancel {
            display: block;
            text-align: center;
            color: #888;
            text-decoration: none;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .btn-cancel:hover { color: white; }
    </style>

<style id="responsive-layout">
/* Adaptació de la mateixa interfície a mòbil, tauleta i ordinador. */
*, *::before, *::after { box-sizing: border-box; }
html, body { max-width: 100%; }
img, video, iframe { max-width: 100%; }
input, select, textarea, button { max-width: 100%; }
.table-responsive { max-width: 100%; }
@media (max-width: 991.98px) {
  .main-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { min-width: 0; }
  .calendar-area { min-width: 0; }
  .navbar .container, .navbar .container-fluid { flex-wrap: wrap; gap: 10px; }
  .custom-select { max-width: 100%; }
}
@media (max-width: 767.98px) {
  body { overflow-x: hidden; }
  #top-bar, .navbar-custom { padding-left: 14px !important; padding-right: 14px !important; }
  #top-bar { gap: 10px; flex-wrap: wrap; }
  #top-bar h1 { font-size: 1rem; }
  .user-nav { gap: 8px; flex-wrap: wrap; }
  .action-bar { padding: 12px 14px; gap: 8px; }
  .action-bar > * { max-width: 100%; }
  .custom-select { width: 100% !important; }
  .calendar-area { padding: 14px !important; }
  #calendar { min-width: 0; max-width: 100%; overflow-x: auto; }
  #calendar .fc { min-width: 620px; }
  .login-card { width: min(340px, calc(100% - 28px)); padding: 28px 22px; }
  .container-fluid, .container { max-width: 100%; }
  .container-fluid.px-5 { padding-left: 14px !important; padding-right: 14px !important; }
  .header-section { padding: 72px 14px 28px !important; }
  .btn-tornar { left: 12px !important; top: 12px !important; }
  .calendar-container { overflow-x: auto !important; }
  .calendar-header-row, .calendar-body-row { min-width: 700px; }
  .empty-state { padding: 28px 18px; }
  .modal-dialog { margin: 12px; }
}
@media (min-width: 768px) and (max-width: 1199.98px) {
  .container-fluid.px-5 { padding-left: 24px !important; padding-right: 24px !important; }
  .calendar-area { padding: 22px; }
}
</style>

</head>
<body>

    <div class="edit-card">
        <h2 class="text-center mb-4" style="font-weight: 800;">EDITAR <span style="color: var(--accent);">RESERVA</span></h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Títol de l'Activitat</label>
                <input type="text" name="titol" class="form-control" value="{{ reserva.activitat }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Instal·lació</label>
                <select name="instalacio" class="form-select">
                    {% for i in instalacions %}
                    <option value="{{ i.id }}" {% if i.id == reserva.instalacio.id %}selected{% endif %}>
                        {{ i.nom }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Dia</label>
                    <input type="date" name="dia" class="form-control" value="{{ dia }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Inici</label>
                    <input type="time" name="hora_inici" class="form-control" value="{{ inici }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Final</label>
                    <input type="time" name="hora_fi" class="form-control" value="{{ fi }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Estat</label>
                <select name="estat" class="form-select">
                    <option value="pendent" {% if reserva.estat == 'pendent' %}selected{% endif %}>Pendent</option>
                    <option value="validada" {% if reserva.estat == 'validada' %}selected{% endif %}>Validada</option>
                    <option value="rebutjada" {% if reserva.estat == 'rebutjada' %}selected{% endif %}>Rebutjada</option>
                </select>
            </div>

            <button type="submit" class="btn btn-save">GUARDAR CANVIS</button>
            <a href="{% url 'gestionar_reserves' %}" class="btn btn-cancel">Cancel·lar i tornar</a>
        </form>
    </div>

</body>
</html>
