[project]
name = "esportscorb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asgiref==3.11.1",
  "certifi==2026.4.22",
  "charset-normalizer==3.4.7",
  "cloudinary==1.44.2",
  "dj-database-url==3.0.1",
  "Django==4.2.29",
  "django-cloudinary-storage==0.3.0",
  "idna==3.14",
  "numpy==2.0.2",
  "pandas==2.3.3",
  "pillow==11.3.0",
  "psycopg==3.2.13",
  "psycopg-binary==3.2.13",
  "psycopg2-binary==2.9.12",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.1",
  "pytz==2026.1.post1",
  "requests==2.32.5",
  "six==1.17.0",
  "sqlparse==0.5.5",
  "typing_extensions==4.15.0",
  "tzdata==2025.3",
  "urllib3==2.6.3",
  "whitenoise==6.11.0",
  "gunicorn==23.0.0",
]


[tool.vercel.scripts]
build = 'if [ -n "$DATABASE_URL" ]; then python manage.py migrate --noinput && python seed_facilities.py && python seed_entities.py; fi'
